<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>JobPilot · Offline</title>
<style>
  :root { --bg:#fafaf9; --fg:#18181b; --muted:#71717a; --accent:#4f46e5; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0c0c0e; --fg:#f4f4f5; --muted:#a1a1aa; --accent:#818cf8; } }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--fg); font:16px/1.5 system-ui,sans-serif; padding:16px; text-align:center; }
  .logo { width:48px; height:48px; border-radius:12px; background:var(--accent); color:#fff; display:grid; place-items:center; font-weight:700; font-size:22px; margin:0 auto 16px; }
  p { color:var(--muted); } button { margin-top:12px; border:0; border-radius:8px; padding:10px 16px; background:var(--accent); color:#fff; font:inherit; font-weight:600; }
</style>
</head>
<body><div><div class="logo">J</div><h1 style="font-size:20px;margin:0">You're offline</h1><p>JobPilot needs a connection to load your jobs and applications.</p><button onclick="location.reload()">Try again</button></div></body>
</html>
